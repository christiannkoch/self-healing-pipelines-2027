[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-pipelines-2027"
version = "0.1.0"
description = "Offline-first reference control plane for governed data-pipeline recovery"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Christian Koch"}]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.urls]
Repository = "https://github.com/christiannkoch/self-healing-pipelines-2027"

[project.optional-dependencies]
agent = [
  "langchain==1.3.14",
  "langchain-openai==1.4.1",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.1",
]
databricks = [
  "databricks-sdk==0.124.0",
]
spark = [
  "pyspark==4.2.0",
]
dev = [
  "PyYAML==6.0.3",
  "pytest>=8,<9",
]
all = [
  "langchain==1.3.14",
  "langchain-openai==1.4.1",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.1",
  "databricks-sdk==0.124.0",
  "pyspark==4.2.0",
  "PyYAML==6.0.3",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
