[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-pipelines-2027"
version = "0.1.0"
description = "Offline-first reference control plane for governed data-pipeline recovery"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Christian Koch"}]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
agent = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
]
databricks = [
  "databricks-sdk>=0.60",
]
dev = [
  "pytest>=8,<9",
]
all = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "databricks-sdk>=0.60",
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
