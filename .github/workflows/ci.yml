name: CI

# Runs the offline example and the full test suite, including the local
# Spark parity tests. A skipped test fails the run, because a skipped Spark
# module is not a completed parity run (see README).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17 for PySpark
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with all pinned extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Run offline example
        run: python examples/run_local.py

      - name: Run tests
        run: |
          unset SPARK_HOME
          export PYSPARK_PYTHON="$(which python)"
          export PYSPARK_DRIVER_PYTHON="$(which python)"
          python -m pytest -q -ra | tee pytest.log
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::Some tests were skipped. The Spark parity run is incomplete."
            exit 1
          fi
